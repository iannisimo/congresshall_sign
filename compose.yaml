version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    build:
      context: ./frontend
    container_name: frontend 
    restart: unless-stopped
    # ports:
    #   - "5001:5001"
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    # ports:
    #   - "5000:5000"
    depends_on:
      - mongo
    environment:
      MONGO_HOST: 'mongo'
      MONGO_PORT: 27017
      MONGO_DB: 'conferences'
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - mongo

volumes:
  mongo_data:

