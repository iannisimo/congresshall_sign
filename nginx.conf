server {
    listen 80;

    location /register {
        deny all;  # Deny access to the /register endpoint
    }

    location / {
        proxy_pass http://backend:5000;  # Proxy all other requests to the backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

